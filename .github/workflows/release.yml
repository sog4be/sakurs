name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Validate the release before publishing
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Validate tag format
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Tag must follow semver format (v1.2.3 or v1.2.3-beta.1)"
            exit 1
          fi
      
      - name: Extract version from tag
        id: version
        run: |
          VERSION="$TAG_NAME"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      
      - name: Validate semver format
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Error: Extracted version '$RELEASE_VERSION' is not valid semver"
            exit 1
          fi

      - name: Set up Python for manifest validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo.lock is current
        run: cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      
      - name: Verify release versions match tag and lockfile
        env:
          CARGO_METADATA_PATH: ${{ runner.temp }}/cargo-metadata.json
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import tomllib

          release_version = os.environ["RELEASE_VERSION"]

          with pathlib.Path("Cargo.toml").open("rb") as file:
              workspace_manifest = tomllib.load(file)

          workspace_version = workspace_manifest["workspace"]["package"]["version"]
          if workspace_version != release_version:
              raise SystemExit(
                  f"Error: Workspace version ({workspace_version}) doesn't match "
                  f"tag ({release_version})"
              )

          manifests = {}
          for crate in ("sakurs-core", "sakurs-cli", "sakurs-py"):
              with pathlib.Path(crate, "Cargo.toml").open("rb") as file:
                  manifest = tomllib.load(file)
              manifests[crate] = manifest
              if manifest["package"].get("version") != {"workspace": True}:
                  raise SystemExit(f"Error: {crate} doesn't use workspace version")

          core_requirement = manifests["sakurs-cli"]["dependencies"]["sakurs-core"]["version"]
          if core_requirement != workspace_version:
              raise SystemExit(
                  "Error: sakurs-cli's sakurs-core requirement "
                  f"({core_requirement}) doesn't match workspace version ({workspace_version})"
              )

          with pathlib.Path(os.environ["CARGO_METADATA_PATH"]).open(encoding="utf-8") as file:
              metadata = json.load(file)

          workspace_member_ids = set(metadata["workspace_members"])
          metadata_packages = {
              package["name"]: package
              for package in metadata["packages"]
              if package["id"] in workspace_member_ids
          }
          expected_packages = set(manifests)
          if set(metadata_packages) != expected_packages:
              raise SystemExit(
                  "Error: Cargo metadata workspace members "
                  f"({sorted(metadata_packages)}) don't match expected crates "
                  f"({sorted(expected_packages)})"
              )

          for package_name, package in metadata_packages.items():
              if package["version"] != workspace_version:
                  raise SystemExit(
                      f"Error: Cargo metadata version for {package_name} "
                      f"({package['version']}) doesn't match workspace version "
                      f"({workspace_version})"
                  )

          with pathlib.Path("Cargo.lock").open("rb") as file:
              lockfile = tomllib.load(file)

          locked_workspace_packages = {
              package["name"]: package["version"]
              for package in lockfile["package"]
              if "source" not in package and package["name"] in expected_packages
          }
          if set(locked_workspace_packages) != expected_packages:
              raise SystemExit(
                  "Error: Cargo.lock workspace packages "
                  f"({sorted(locked_workspace_packages)}) don't match expected crates "
                  f"({sorted(expected_packages)})"
              )

          for package_name, locked_version in locked_workspace_packages.items():
              if locked_version != workspace_version:
                  raise SystemExit(
                      f"Error: Cargo.lock version for {package_name} ({locked_version}) "
                      f"doesn't match workspace version ({workspace_version})"
                  )

          print(f"✓ Manifests, metadata, and Cargo.lock all use {workspace_version}")
          PY

      - name: Validate changelog section
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ ! -f CHANGELOG.md ]]; then
            echo "Error: CHANGELOG.md not found"
            exit 1
          fi

          CHANGELOG_FILE=$(mktemp)
          if ! awk -v heading="## [$RELEASE_VERSION]" '
            index($0, heading) == 1 && \
              (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") {
              found = 1
              next
            }
            found && index($0, "## ") == 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$CHANGELOG_FILE"; then
            echo "Error: CHANGELOG.md has no section for $RELEASE_VERSION"
            exit 1
          fi

          if ! grep -q '[^[:space:]]' "$CHANGELOG_FILE"; then
            echo "Error: CHANGELOG.md section for $RELEASE_VERSION is empty"
            exit 1
          fi

          echo "✓ CHANGELOG.md contains a non-empty section for $RELEASE_VERSION"
    
    outputs:
      version: ${{ steps.version.outputs.version }}

  # Run tests before publishing
  test:
    name: Run Tests
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Check formatting
        run: cargo fmt --all -- --check
      
      - name: Run clippy
        run: cargo clippy --workspace --locked -- -D warnings
      
      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run compilation check
        run: cargo check --workspace --locked

  # Package every Rust crate before any irreversible registry writes.
  package-preflight:
    name: Package Preflight
    needs: [validate, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package sakurs-core with verification
        run: cargo package -p sakurs-core --locked

      - name: Package sakurs-cli with verification
        # Cargo strips path dependencies from the published manifest, so an
        # unpublished same-version core needs a local crates.io patch while
        # verifying the CLI archive. The patch is command-local and is not
        # included in the package that cargo publish uploads.
        run: |
          CORE_PATH="$PWD/sakurs-core"
          cargo package -p sakurs-cli --locked \
            --config "patch.crates-io.sakurs-core.path='$CORE_PATH'"

  # Publish sakurs-core only after all packages and wheels have been built.
  publish-core:
    name: Publish Core to crates.io
    needs: [validate, test, package-preflight, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd sakurs-core
          # Retry logic for transient failures
          for i in {1..3}; do
            if cargo publish --locked; then
              echo "Successfully published to crates.io"
              break
            else
              # Check if it's a transient error (network, server issues)
              if cargo info "sakurs-core@$RELEASE_VERSION" --registry crates-io >/dev/null 2>&1; then
                echo "Package already published, skipping"
                break
              fi
              
              if [ "$i" -eq 3 ]; then
                echo "Failed to publish after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 30 seconds..."
              sleep 30
            fi
          done

  # Publish sakurs-cli to crates.io
  publish-cli:
    name: Publish CLI to crates.io
    needs: [validate, publish-core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd sakurs-cli
          # Retry logic for transient failures
          for i in {1..3}; do
            if cargo publish --locked; then
              echo "Successfully published to crates.io"
              break
            else
              # Check if it's a transient error (network, server issues)
              if cargo info "sakurs-cli@$RELEASE_VERSION" --registry crates-io >/dev/null 2>&1; then
                echo "Package already published, skipping"
                break
              fi
              
              if [ "$i" -eq 3 ]; then
                echo "Failed to publish after 3 attempts"
                exit 1
              fi
              echo "Attempt $i failed, retrying in 30 seconds..."
              sleep 30
            fi
          done

  # Build all Python wheels before publishing any package.
  build-wheels:
    name: Build Python ${{ matrix.platform.name }}
    needs: [validate, test]
    strategy:
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64
          # Intel macOS runners (macos-13) were retired by GitHub; the
          # x86_64 wheel is cross-compiled on an ARM runner instead
          # (maturin passes --target x86_64-apple-darwin to the toolchain).
          - name: macOS x86_64
            runner: macos-14
            target: x86_64
          - name: macOS ARM64
            runner: macos-14
            target: aarch64
          - name: Windows x86_64
            runner: windows-latest
            target: x64
    
    runs-on: ${{ matrix.platform.runner }}
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Build against the minimum supported ABI so one wheel works on all
          # supported CPython versions.
          python-version: '3.10'
      
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --features extension-module
          working-directory: sakurs-py
          manylinux: auto
      
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.platform.target }}
          path: sakurs-py/dist
          if-no-files-found: error
          overwrite: true

  # Upload all wheels to PyPI
  upload-pypi:
    name: Upload to PyPI
    needs: [build-wheels, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/sakurs
    
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      
      - name: Display structure of downloaded files
        run: ls -la dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    needs: [validate, test, package-preflight, build-wheels, publish-core, publish-cli, upload-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract changelog for this version
        id: changelog
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          CHANGELOG_FILE=$(mktemp)

          if ! awk -v heading="## [$RELEASE_VERSION]" '
            index($0, heading) == 1 && \
              (length($0) == length(heading) || substr($0, length(heading) + 1, 1) == " ") {
              found = 1
              next
            }
            found && index($0, "## ") == 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$CHANGELOG_FILE"; then
            echo "Error: CHANGELOG.md has no section for $RELEASE_VERSION"
            exit 1
          fi

          if ! grep -q '[^[:space:]]' "$CHANGELOG_FILE"; then
            echo "Error: CHANGELOG.md section for $RELEASE_VERSION is empty"
            exit 1
          fi

          echo "changelog_file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
      
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          bodyFile: ${{ steps.changelog.outputs.changelog_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
